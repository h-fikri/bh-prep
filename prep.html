<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prep List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#86204f" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div>
          <p class="eyebrow">Daily prep</p>
          <h1 class="hero-title" id="page-title">Prep List</h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <div class="header-actions no-print">
          <button class="filter-btn" id="print-btn" type="button">Print</button>
          <button class="filter-btn" id="toggle-filter" aria-expanded="false">Filter</button>
        </div>
      </div>
      <section id="filter-panel" class="filter-panel" hidden></section>
      <div id="active-filters" class="active-filters" hidden></div>
      <section id="list"></section>
      <p class="error" id="message"></p>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const {
          getQueryParams,
          fetchJSON,
          renderMessage,
          buildLocationOptions,
          filterByLocations,
        } = window.PrepUtils;

        const params = getQueryParams();
        const week = parseInt(params.week, 10);
        const day = params.day;
        const listEl = document.getElementById("list");
        const msgEl = document.getElementById("message");
        const subtitle = document.getElementById("subtitle");
        const toggleFilterBtn = document.getElementById("toggle-filter");
        const filterPanel = document.getElementById("filter-panel");
        let selectedLocations = [];
        let allItems = [];

        if (!week || !day) {
          renderMessage(msgEl, "Missing week or day.");
          return;
        }

        subtitle.textContent = `Week ${week} · ${day.toUpperCase()}`;
        window.PrepUtils.renderNav("prep", week, day);
        document.getElementById("print-btn").addEventListener("click", () => window.print());
        const tickKey = `prep:${week}:${day}`;
        const ticks = window.PrepUtils.loadTicks(tickKey);

        toggleFilterBtn.addEventListener("click", () => {
          const isHidden = filterPanel.hasAttribute("hidden");
          if (isHidden) {
            filterPanel.removeAttribute("hidden");
          } else {
            filterPanel.setAttribute("hidden", "true");
          }
          toggleFilterBtn.setAttribute("aria-expanded", String(isHidden));
        });

        function renderList(items) {
          listEl.innerHTML = "";
          msgEl.textContent = "";
          if (!items.length) {
            renderMessage(msgEl, `No prep items found for Week ${week} · ${day.toUpperCase()}`);
            return;
          }

          const grouped = items.reduce((acc, item) => {
            const key = item.section || "Other";
            acc[key] = acc[key] || [];
            acc[key].push(item);
            return acc;
          }, {});

          Object.keys(grouped).forEach((section) => {
            const secEl = document.createElement("div");
            secEl.className = "section sec-" + section.toLowerCase().replace(/[^a-z]/g, "");

            const header = document.createElement("h2");
            header.textContent = section;
            secEl.appendChild(header);

            grouped[section].forEach((item) => {
              const row = document.createElement("div");
              row.className = "list-item";
              const id = `${section}|${item.item}|${item.usageNote}`;

              const box = document.createElement("input");
              box.type = "checkbox";
              box.className = "tick";
              box.setAttribute("aria-label", `Done: ${item.item}`);
              box.checked = !!ticks[id];
              row.classList.toggle("done", box.checked);
              box.addEventListener("change", () => {
                if (box.checked) ticks[id] = 1;
                else delete ticks[id];
                window.PrepUtils.saveTicks(tickKey, ticks);
                row.classList.toggle("done", box.checked);
              });
              row.appendChild(box);

              const main = document.createElement("div");
              main.className = "item-main";
              const title = document.createElement(item.dishSlug ? "a" : "span");
              if (item.dishSlug) {
                title.href = `dish.html?dish=${encodeURIComponent(item.dishSlug)}`;
              }
              title.textContent = item.item;
              main.appendChild(title);

              if (item.qty) {
                const qty = document.createElement("span");
                qty.className = "qty";
                qty.textContent = item.qty;
                main.appendChild(qty);
              }

              if (item.notes) {
                const notes = document.createElement("div");
                notes.className = "item-notes";
                notes.textContent = item.notes;
                main.appendChild(notes);
              }

              if (item.location) {
                const locs = document.createElement("div");
                locs.className = "badges";
                item.location.split(" | ").forEach((loc) => {
                  const badge = document.createElement("span");
                  badge.className = "badge";
                  badge.textContent = loc.trim();
                  locs.appendChild(badge);
                });
                main.appendChild(locs);
              }
              row.appendChild(main);

              if (item.usageNote) {
                const note = document.createElement("span");
                note.className = "note";
                note.textContent = item.usageNote;
                row.appendChild(note);
              }

              secEl.appendChild(row);
            });

            listEl.appendChild(secEl);
          });
        }

        const NO_SERVE = "No serve time";
        // One place that remembers what is selected. Serve and dish filters only touch MAINS.
        const sel = { serve: [], dish: [], location: [] };
        const chipEls = {}; // "group|value" -> button, so the summary bar can switch chips off again
        const activeBar = document.getElementById("active-filters");

        function totalSelected() {
          return sel.serve.length + sel.dish.length + sel.location.length;
        }

        function applyFilters() {
          selectedLocations = sel.location;
          let items = filterByLocations(allItems, sel.location);
          items = items.filter((item) => {
            if (item.section !== "MAINS") return true;
            const serve = item.usageNote || NO_SERVE;
            if (sel.serve.length && !sel.serve.includes(serve)) return false;
            if (sel.dish.length && !sel.dish.includes(item.item)) return false;
            return true;
          });
          renderList(items);

          const count = totalSelected();
          toggleFilterBtn.textContent = count ? `Filter · ${count} on` : "Filter";
          toggleFilterBtn.classList.toggle("active", count > 0);
          renderActiveBar(items);
        }

        function setSelected(group, value, on) {
          const list = sel[group];
          const i = list.indexOf(value);
          if (on && i === -1) list.push(value);
          if (!on && i !== -1) list.splice(i, 1);
          const chip = chipEls[group + "|" + value];
          if (chip) {
            chip.classList.toggle("on", on);
            chip.setAttribute("aria-pressed", String(on));
          }
          applyFilters();
        }

        // Always-visible summary, so you can see what is on even when the filter panel is closed.
        function renderActiveBar(shownItems) {
          activeBar.innerHTML = "";
          if (!totalSelected()) {
            activeBar.hidden = true;
            return;
          }
          activeBar.hidden = false;

          const mainsAll = allItems.filter((x) => x.section === "MAINS").length;
          const mainsShown = shownItems.filter((x) => x.section === "MAINS").length;
          const head = document.createElement("div");
          head.className = "active-head";
          head.textContent = `Filtering: showing ${mainsShown} of ${mainsAll} mains`;
          activeBar.appendChild(head);

          const row = document.createElement("div");
          row.className = "active-pills";
          ["serve", "dish", "location"].forEach((group) => {
            sel[group].forEach((value) => {
              const pill = document.createElement("button");
              pill.type = "button";
              pill.className = "pill";
              pill.setAttribute("aria-label", `Remove filter ${value}`);
              pill.textContent = value + "  ✕";
              pill.addEventListener("click", () => setSelected(group, value, false));
              row.appendChild(pill);
            });
          });
          const clear = document.createElement("button");
          clear.type = "button";
          clear.className = "pill clear";
          clear.textContent = "Clear all";
          clear.addEventListener("click", clearAll);
          row.appendChild(clear);
          activeBar.appendChild(row);
        }

        function clearAll() {
          sel.serve = [];
          sel.dish = [];
          sel.location = [];
          Object.values(chipEls).forEach((chip) => {
            chip.classList.remove("on");
            chip.setAttribute("aria-pressed", "false");
          });
          applyFilters();
        }

        function addChips(title, group, values) {
          if (!values.length) return;
          const legend = document.createElement("p");
          legend.className = "filter-title";
          legend.textContent = title;
          filterPanel.appendChild(legend);
          const wrap = document.createElement("div");
          wrap.className = "chips";
          values.forEach((value) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip";
            chip.setAttribute("aria-pressed", "false");
            chip.textContent = value;
            chip.addEventListener("click", () => setSelected(group, value, !sel[group].includes(value)));
            chipEls[group + "|" + value] = chip;
            wrap.appendChild(chip);
          });
          filterPanel.appendChild(wrap);
        }

        function renderFilters(items) {
          const mains = items.filter((item) => item.section === "MAINS");
          const serves = [];
          mains.forEach((item) => {
            const s = item.usageNote || NO_SERVE;
            if (!serves.includes(s)) serves.push(s);
          });
          if (serves.length > 1) addChips("Mains by serve (tap to turn on)", "serve", serves);
          addChips("Mains (tap one or more)", "dish", mains.map((item) => item.item));
          addChips("Location (all sections)", "location", buildLocationOptions(items));

          const actions = document.createElement("div");
          actions.className = "filter-actions";
          const done = document.createElement("button");
          done.type = "button";
          done.className = "primary-btn done-btn";
          done.textContent = "Show list";
          done.addEventListener("click", () => {
            filterPanel.setAttribute("hidden", "true");
            toggleFilterBtn.setAttribute("aria-expanded", "false");
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          const clear = document.createElement("button");
          clear.type = "button";
          clear.className = "filter-btn";
          clear.textContent = "Clear all";
          clear.addEventListener("click", clearAll);
          actions.appendChild(clear);
          actions.appendChild(done);
          filterPanel.appendChild(actions);
        }

        async function init() {
          try {
            const data = await fetchJSON("data/prep.json");
            allItems = data.filter(
              (item) => Number(item.week) === week && item.day === day
            );
            renderFilters(allItems);
            renderList(allItems);
          } catch (err) {
            renderMessage(msgEl, "Failed to load prep data.");
          }
        }

        init();
      })();
    </script>
  </body>
</html>
