<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prep List</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div>
          <h1 class="hero-title" id="page-title">Prep List</h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <div class="header-actions no-print">
          <button class="filter-btn" id="print-btn" type="button">Print</button>
          <button class="filter-btn" id="toggle-filter" aria-expanded="false">Filter</button>
        </div>
      </div>
      <section id="filter-panel" class="filter-panel" hidden></section>
      <section id="list"></section>
      <p class="error" id="message"></p>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const {
          getQueryParams,
          fetchJSON,
          renderMessage,
          buildLocationOptions,
          filterByLocations,
        } = window.PrepUtils;

        const params = getQueryParams();
        const week = parseInt(params.week, 10);
        const day = params.day;
        const listEl = document.getElementById("list");
        const msgEl = document.getElementById("message");
        const subtitle = document.getElementById("subtitle");
        const toggleFilterBtn = document.getElementById("toggle-filter");
        const filterPanel = document.getElementById("filter-panel");
        let selectedLocations = [];
        let allItems = [];

        if (!week || !day) {
          renderMessage(msgEl, "Missing week or day.");
          return;
        }

        subtitle.textContent = `Week ${week} · ${day.toUpperCase()}`;
        window.PrepUtils.renderNav("prep", week, day);
        document.getElementById("print-btn").addEventListener("click", () => window.print());
        const tickKey = `prep:${week}:${day}`;
        const ticks = window.PrepUtils.loadTicks(tickKey);

        toggleFilterBtn.addEventListener("click", () => {
          const isHidden = filterPanel.hasAttribute("hidden");
          if (isHidden) {
            filterPanel.removeAttribute("hidden");
          } else {
            filterPanel.setAttribute("hidden", "true");
          }
          toggleFilterBtn.setAttribute("aria-expanded", String(isHidden));
        });

        function renderList(items) {
          listEl.innerHTML = "";
          msgEl.textContent = "";
          if (!items.length) {
            renderMessage(msgEl, `No prep items found for Week ${week} · ${day.toUpperCase()}`);
            return;
          }

          const grouped = items.reduce((acc, item) => {
            const key = item.section || "Other";
            acc[key] = acc[key] || [];
            acc[key].push(item);
            return acc;
          }, {});

          Object.keys(grouped).forEach((section) => {
            const secEl = document.createElement("div");
            secEl.className = "section sec-" + section.toLowerCase().replace(/[^a-z]/g, "");

            const header = document.createElement("h2");
            header.textContent = section;
            secEl.appendChild(header);

            grouped[section].forEach((item) => {
              const row = document.createElement("div");
              row.className = "list-item";
              const id = `${section}|${item.item}|${item.usageNote}`;

              const box = document.createElement("input");
              box.type = "checkbox";
              box.className = "tick";
              box.setAttribute("aria-label", `Done: ${item.item}`);
              box.checked = !!ticks[id];
              row.classList.toggle("done", box.checked);
              box.addEventListener("change", () => {
                if (box.checked) ticks[id] = 1;
                else delete ticks[id];
                window.PrepUtils.saveTicks(tickKey, ticks);
                row.classList.toggle("done", box.checked);
              });
              row.appendChild(box);

              const main = document.createElement("div");
              main.className = "item-main";
              const title = document.createElement(item.dishSlug ? "a" : "span");
              if (item.dishSlug) {
                title.href = `dish.html?dish=${encodeURIComponent(item.dishSlug)}`;
              }
              title.textContent = item.item;
              main.appendChild(title);

              if (item.qty) {
                const qty = document.createElement("span");
                qty.className = "qty";
                qty.textContent = item.qty;
                main.appendChild(qty);
              }

              if (item.notes) {
                const notes = document.createElement("div");
                notes.className = "item-notes";
                notes.textContent = item.notes;
                main.appendChild(notes);
              }

              if (item.location) {
                const locs = document.createElement("div");
                locs.className = "badges";
                item.location.split(" | ").forEach((loc) => {
                  const badge = document.createElement("span");
                  badge.className = "badge";
                  badge.textContent = loc.trim();
                  locs.appendChild(badge);
                });
                main.appendChild(locs);
              }
              row.appendChild(main);

              if (item.usageNote) {
                const note = document.createElement("span");
                note.className = "note";
                note.textContent = item.usageNote;
                row.appendChild(note);
              }

              secEl.appendChild(row);
            });

            listEl.appendChild(secEl);
          });
        }

        let selectedServes = [];
        let selectedDishes = [];
        const NO_SERVE = "No serve time";

        // Serve and dish filters only touch MAINS. Veg, soups and prep are never hidden by them.
        function applyFilters() {
          let items = filterByLocations(allItems, selectedLocations);
          items = items.filter((item) => {
            if (item.section !== "MAINS") return true;
            const serve = item.usageNote || NO_SERVE;
            if (selectedServes.length && !selectedServes.includes(serve)) return false;
            if (selectedDishes.length && !selectedDishes.includes(item.item)) return false;
            return true;
          });
          renderList(items);
          const count = selectedServes.length + selectedDishes.length + selectedLocations.length;
          toggleFilterBtn.textContent = count ? `Filter (${count})` : "Filter";
          const clear = document.getElementById("clear-filters");
          if (clear) clear.hidden = !count;
        }

        function addChips(title, values, selected, onToggle) {
          if (!values.length) return;
          const legend = document.createElement("p");
          legend.className = "muted filter-title";
          legend.textContent = title;
          filterPanel.appendChild(legend);
          const wrap = document.createElement("div");
          wrap.className = "chips";
          values.forEach((value) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip";
            chip.textContent = value;
            chip.addEventListener("click", () => {
              const on = onToggle(value);
              chip.classList.toggle("on", on);
              applyFilters();
            });
            wrap.appendChild(chip);
          });
          filterPanel.appendChild(wrap);
        }

        function toggleIn(list, value) {
          const i = list.indexOf(value);
          if (i === -1) list.push(value);
          else list.splice(i, 1);
          return i === -1;
        }

        function renderFilters(items) {
          const mains = items.filter((item) => item.section === "MAINS");
          const serves = [];
          mains.forEach((item) => {
            const s = item.usageNote || NO_SERVE;
            if (!serves.includes(s)) serves.push(s);
          });
          const dishes = mains.map((item) => item.item);
          const locations = buildLocationOptions(items);

          if (serves.length > 1) {
            addChips("Mains by serve:", serves, selectedServes, (v) => toggleIn(selectedServes, v));
          }
          addChips("Mains (pick one or more):", dishes, selectedDishes, (v) => toggleIn(selectedDishes, v));
          addChips("Location:", locations, selectedLocations, (v) => toggleIn(selectedLocations, v));

          const clear = document.createElement("button");
          clear.type = "button";
          clear.id = "clear-filters";
          clear.className = "filter-btn";
          clear.textContent = "Clear filters";
          clear.hidden = true;
          clear.addEventListener("click", () => {
            selectedServes = [];
            selectedDishes = [];
            selectedLocations = [];
            filterPanel.querySelectorAll(".chip.on").forEach((c) => c.classList.remove("on"));
            applyFilters();
          });
          filterPanel.appendChild(clear);
        }

        async function init() {
          try {
            const data = await fetchJSON("data/prep.json");
            allItems = data.filter(
              (item) => Number(item.week) === week && item.day === day
            );
            renderFilters(allItems);
            renderList(allItems);
          } catch (err) {
            renderMessage(msgEl, "Failed to load prep data.");
          }
        }

        init();
      })();
    </script>
  </body>
</html>
