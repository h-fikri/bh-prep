<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick List</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div>
          <h1 class="hero-title" id="page-title">Pick List</h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <button class="filter-btn no-print" id="print-btn" type="button">Print</button>
      </div>
      <section id="list"></section>
      <p class="error" id="message"></p>
      <button class="filter-btn reset-btn no-print" id="reset" type="button">Clear ticks</button>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const { getQueryParams, fetchJSON, renderMessage } = window.PrepUtils;
        const params = getQueryParams();
        const week = parseInt(params.week, 10);
        const day = params.day;
        let current = params.list === "freezer" ? "freezer" : "dry";

        const listEl = document.getElementById("list");
        const msgEl = document.getElementById("message");
        const dayNames = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday" };

        if (!week || !day) {
          renderMessage(msgEl, "Missing week or day.");
          return;
        }
        document.getElementById("subtitle").textContent = `Week ${week} · ${dayNames[day] || day}`;
        window.PrepUtils.renderNav(current, week, day);
        document.getElementById("print-btn").addEventListener("click", () => window.print());

        const storeKey = (list) => `pick:${week}:${day}:${list}`;
        const loadTicks = (list) => window.PrepUtils.loadTicks(storeKey(list));
        const saveTicks = (list, ticks) => window.PrepUtils.saveTicks(storeKey(list), ticks);

        let all = [];

        function render() {
          listEl.innerHTML = "";
          msgEl.textContent = "";
          document.getElementById("page-title").textContent = current === "freezer" ? "Freezer Pick" : "Dry Store Pick";
          const rows = all.filter((r) => r.list === current);
          if (!rows.length) {
            renderMessage(msgEl, "Nothing to pick for this list.");
            return;
          }
          const ticks = loadTicks(current);
          const groups = [];
          rows.forEach((r, i) => {
            let g = groups.find((x) => x.name === r.group);
            if (!g) {
              g = { name: r.group, rows: [] };
              groups.push(g);
            }
            g.rows.push({ ...r, id: `${r.group}|${r.item}` });
          });

          groups.forEach((g) => {
            const sec = document.createElement("div");
            sec.className = "section";
            if (g.name) {
              const h = document.createElement("h2");
              h.textContent = g.name;
              sec.appendChild(h);
            }
            g.rows.forEach((r) => {
              const row = document.createElement("label");
              row.className = "pick-item" + (r.skip ? " skipped" : "");

              const box = document.createElement("input");
              box.type = "checkbox";
              box.disabled = r.skip;
              box.checked = !!ticks[r.id];
              row.classList.toggle("done", box.checked);
              box.addEventListener("change", () => {
                const t = loadTicks(current);
                if (box.checked) t[r.id] = 1;
                else delete t[r.id];
                saveTicks(current, t);
                row.classList.toggle("done", box.checked);
              });
              row.appendChild(box);

              const body = document.createElement("div");
              body.className = "pick-body";
              const top = document.createElement("div");
              top.className = "pick-top";
              const name = document.createElement("span");
              name.className = "pick-name";
              name.textContent = r.item;
              top.appendChild(name);
              if (r.pick) {
                const q = document.createElement("span");
                q.className = "pick-qty";
                q.textContent = r.pick;
                top.appendChild(q);
              }
              body.appendChild(top);
              const sub = [r.forDish, r.note].filter(Boolean).join(" · ");
              if (sub) {
                const s = document.createElement("div");
                s.className = "item-notes";
                s.textContent = sub;
                body.appendChild(s);
              }
              row.appendChild(body);
              sec.appendChild(row);
            });
            listEl.appendChild(sec);
          });
        }

        document.getElementById("reset").addEventListener("click", () => {
          saveTicks(current, {});
          render();
        });

        async function init() {
          try {
            const data = await fetchJSON("data/pick.json");
            all = data.filter((r) => Number(r.week) === week && r.day === day);
            render();
          } catch (err) {
            renderMessage(msgEl, "Failed to load pick data.");
          }
        }
        init();
      })();
    </script>
  </body>
</html>
