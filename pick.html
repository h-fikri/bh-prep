<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick List</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div>
          <h1 class="hero-title" id="page-title">Pick List</h1>
          <p class="muted" id="subtitle"></p>
        </div>
        <a class="filter-btn" id="back-link" href="#">Prep list</a>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-dry" data-list="dry" role="tab">Dry Store</button>
        <button class="tab" id="tab-freezer" data-list="freezer" role="tab">Freezer</button>
      </div>
      <section id="list"></section>
      <p class="error" id="message"></p>
      <button class="filter-btn reset-btn" id="reset" type="button">Clear ticks</button>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const { getQueryParams, fetchJSON, renderMessage } = window.PrepUtils;
        const params = getQueryParams();
        const week = parseInt(params.week, 10);
        const day = params.day;
        let current = params.list === "freezer" ? "freezer" : "dry";

        const listEl = document.getElementById("list");
        const msgEl = document.getElementById("message");
        const tabs = document.querySelectorAll(".tab");
        const dayNames = { mon: "Monday", tue: "Tuesday", wed: "Wednesday", thu: "Thursday", fri: "Friday" };

        if (!week || !day) {
          renderMessage(msgEl, "Missing week or day.");
          return;
        }
        document.getElementById("subtitle").textContent = `Week ${week} · ${dayNames[day] || day}`;
        document.getElementById("back-link").href = `prep.html?week=${week}&day=${day}`;

        // Ticks are remembered on this device only (localStorage may be blocked, so always try/catch).
        const storeKey = (list) => `pick:${week}:${day}:${list}`;
        function loadTicks(list) {
          try {
            return JSON.parse(localStorage.getItem(storeKey(list)) || "{}");
          } catch (e) {
            return {};
          }
        }
        function saveTicks(list, ticks) {
          try {
            localStorage.setItem(storeKey(list), JSON.stringify(ticks));
          } catch (e) {}
        }

        let all = [];

        function render() {
          listEl.innerHTML = "";
          msgEl.textContent = "";
          tabs.forEach((t) => t.classList.toggle("active", t.dataset.list === current));
          const rows = all.filter((r) => r.list === current);
          if (!rows.length) {
            renderMessage(msgEl, "Nothing to pick for this list.");
            return;
          }
          const ticks = loadTicks(current);
          const groups = [];
          rows.forEach((r, i) => {
            let g = groups.find((x) => x.name === r.group);
            if (!g) {
              g = { name: r.group, rows: [] };
              groups.push(g);
            }
            g.rows.push({ ...r, id: String(i) });
          });

          groups.forEach((g) => {
            const sec = document.createElement("div");
            sec.className = "section";
            if (g.name) {
              const h = document.createElement("h2");
              h.textContent = g.name;
              sec.appendChild(h);
            }
            g.rows.forEach((r) => {
              const row = document.createElement("label");
              row.className = "pick-item" + (r.skip ? " skipped" : "");

              const box = document.createElement("input");
              box.type = "checkbox";
              box.disabled = r.skip;
              box.checked = !!ticks[r.id];
              row.classList.toggle("done", box.checked);
              box.addEventListener("change", () => {
                const t = loadTicks(current);
                if (box.checked) t[r.id] = 1;
                else delete t[r.id];
                saveTicks(current, t);
                row.classList.toggle("done", box.checked);
              });
              row.appendChild(box);

              const body = document.createElement("div");
              body.className = "pick-body";
              const top = document.createElement("div");
              top.className = "pick-top";
              const name = document.createElement("span");
              name.className = "pick-name";
              name.textContent = r.item;
              top.appendChild(name);
              if (r.pick) {
                const q = document.createElement("span");
                q.className = "pick-qty";
                q.textContent = r.pick;
                top.appendChild(q);
              }
              body.appendChild(top);
              const sub = [r.forDish, r.note].filter(Boolean).join(" · ");
              if (sub) {
                const s = document.createElement("div");
                s.className = "item-notes";
                s.textContent = sub;
                body.appendChild(s);
              }
              row.appendChild(body);
              sec.appendChild(row);
            });
            listEl.appendChild(sec);
          });
        }

        tabs.forEach((t) =>
          t.addEventListener("click", () => {
            current = t.dataset.list;
            render();
          })
        );
        document.getElementById("reset").addEventListener("click", () => {
          saveTicks(current, {});
          render();
        });

        async function init() {
          try {
            const data = await fetchJSON("data/pick.json");
            all = data.filter((r) => Number(r.week) === week && r.day === day);
            render();
          } catch (err) {
            renderMessage(msgEl, "Failed to load pick data.");
          }
        }
        init();
      })();
    </script>
  </body>
</html>
