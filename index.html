<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Café Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#86204f" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <p class="eyebrow" id="hero-eyebrow">Today</p>
        <h1 class="hero-title" id="hero-title">Prep lists</h1>
        <p class="hero-sub">Summer Menu · prep and pick lists</p>
      </section>

      <section class="quick" aria-label="Get started">
        <h2>Get started</h2>
        <a class="quick-link" id="ql-prep" href="#"><span>Prep list</span><span class="chev" aria-hidden="true">&rsaquo;</span></a>
        <a class="quick-link" id="ql-dry" href="#"><span>Dry store pick list</span><span class="chev" aria-hidden="true">&rsaquo;</span></a>
        <a class="quick-link" id="ql-freezer" href="#"><span>Freezer pick list</span><span class="chev" aria-hidden="true">&rsaquo;</span></a>
      </section>

      <section class="card" aria-label="Choose another day">
        <h2>Choose another day</h2>
        <div class="segmented" role="tablist" aria-label="Week">
          <button type="button" class="seg" data-week="1" role="tab">Week 1</button>
          <button type="button" class="seg" data-week="2" role="tab">Week 2</button>
        </div>
        <div class="day-grid" id="day-grid"></div>
        <button type="button" class="filter-btn" id="today-btn">Back to today</button>
      </section>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const { getSuggestedWeekday, DAY_LONG, renderChrome } = window.PrepUtils;
        renderChrome("home");

        const suggestion = getSuggestedWeekday();
        const isWeekend = [0, 6].includes(new Date().getDay());
        const state = { week: suggestion.week, day: suggestion.dayShort };

        const title = document.getElementById("hero-title");
        const eyebrow = document.getElementById("hero-eyebrow");
        const grid = document.getElementById("day-grid");
        const segs = document.querySelectorAll(".seg");
        const todayBtn = document.getElementById("today-btn");
        const days = Object.keys(DAY_LONG);

        function isSuggested() {
          return state.week === suggestion.week && state.day === suggestion.dayShort;
        }

        function render() {
          title.textContent = `Week ${state.week} · ${DAY_LONG[state.day]}`;
          eyebrow.textContent = isSuggested() ? (isWeekend ? "Next workday" : "Today") : "Selected day";
          todayBtn.hidden = isSuggested();
          document.getElementById("ql-prep").href = `prep.html?week=${state.week}&day=${state.day}`;
          document.getElementById("ql-dry").href = `pick.html?week=${state.week}&day=${state.day}&list=dry`;
          document.getElementById("ql-freezer").href = `pick.html?week=${state.week}&day=${state.day}&list=freezer`;
          segs.forEach((s) => {
            const on = Number(s.dataset.week) === state.week;
            s.classList.toggle("on", on);
            s.setAttribute("aria-selected", String(on));
          });
          grid.innerHTML = "";
          days.forEach((d) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "day-btn" + (d === state.day ? " on" : "");
            b.setAttribute("aria-pressed", String(d === state.day));
            b.innerHTML = `<strong>${d.toUpperCase()}</strong><small>${DAY_LONG[d]}</small>`;
            b.addEventListener("click", () => {
              state.day = d;
              render();
            });
            grid.appendChild(b);
          });
        }

        segs.forEach((s) =>
          s.addEventListener("click", () => {
            state.week = Number(s.dataset.week);
            render();
          })
        );
        todayBtn.addEventListener("click", () => {
          state.week = suggestion.week;
          state.day = suggestion.dayShort;
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
