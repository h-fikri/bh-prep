<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dish Detail</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="hero-title" id="dish-title">Dish</h1>
      <p class="top-links"><a class="back-link" href="javascript:history.back()">← Back</a><a class="back-link" href="index.html">⌂ Home</a></p>
      <div id="table-wrap"></div>
      <p class="error" id="message"></p>
    </main>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const { fetchJSON, getQueryParams, renderMessage } = window.PrepUtils;
        const params = getQueryParams();
        const slug = params.dish;
        const titleEl = document.getElementById("dish-title");
        const tableWrap = document.getElementById("table-wrap");
        const msgEl = document.getElementById("message");

        if (!slug) {
          renderMessage(msgEl, "Dish not found.");
          return;
        }

        async function init() {
          try {
            const data = await fetchJSON("data/dishes.json");
            const dish = data.find((row) => row.dishSlug === slug);
            if (!dish) {
              renderMessage(msgEl, "Dish not found.");
              return;
            }
            titleEl.textContent = dish.dishName;
            document.title = dish.dishName;

            const ingredients = dish.ingredients || [];
            const hasNotes = ingredients.some((row) => row.notes);
            const headers = ["Ingredient", "Amount"];
            if (hasNotes) headers.push("Notes");

            const table = document.createElement("table");
            table.className = "table";
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            headers.forEach((text) => {
              const th = document.createElement("th");
              th.textContent = text;
              headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            let currentGroup = null;
            ingredients.forEach((row) => {
              const group = row.group || null;
              if (group !== currentGroup) {
                currentGroup = group;
                if (group) {
                  const gr = document.createElement("tr");
                  gr.className = "group-row";
                  const td = document.createElement("td");
                  td.colSpan = headers.length;
                  td.textContent = group;
                  gr.appendChild(td);
                  tbody.appendChild(gr);
                }
              }
              const tr = document.createElement("tr");
              const cells = [row.ingredient, row.amountText];
              if (hasNotes) cells.push(row.notes || "");
              cells.forEach((text) => {
                const td = document.createElement("td");
                td.textContent = text;
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            tableWrap.appendChild(table);

            if (dish.notes && dish.notes.length) {
              const box = document.createElement("div");
              box.className = "dish-notes";
              const h = document.createElement("h2");
              h.textContent = "Notes";
              box.appendChild(h);
              const ul = document.createElement("ul");
              dish.notes.forEach((text) => {
                const li = document.createElement("li");
                li.textContent = text;
                ul.appendChild(li);
              });
              box.appendChild(ul);
              tableWrap.appendChild(box);
            }
          } catch (err) {
            renderMessage(msgEl, "Failed to load dish data.");
          }
        }

        init();
      })();
    </script>
  </body>
</html>
